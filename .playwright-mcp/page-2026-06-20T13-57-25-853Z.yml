                - text: designed for solo developers and growing teams. Plus costs $15/month (billed annually) or $19/month (billed monthly). Pro costs $39/month (billed annually) or $49/month (billed monthly). Free plan is $0 forever — 1 provider, no expiry. Corporate proxy plans are targeting Q3 2026.
            - generic [ref=e354]:
              - heading "What payment methods do you accept?" [level=3] [ref=e355]
              - paragraph [ref=e356]: Payments are processed by Stripe — all major credit and debit cards are supported. You can upgrade, downgrade, or cancel from billing settings at any time.
            - generic [ref=e357]:
              - heading "How do I contact support?" [level=3] [ref=e358]
              - paragraph [ref=e359]: You can contact support by email at support@getfrugal.dev. We are here to help you with any questions or issues.
