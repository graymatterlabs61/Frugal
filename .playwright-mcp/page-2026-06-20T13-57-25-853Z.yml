            - generic [ref=e330]:
              - heading "What is Frugal?" [level=3] [ref=e331]
              - paragraph [ref=e332]: Frugal is an AI API cost management SaaS. We help you connect your AI provider accounts and get real-time spend dashboards, budget rules, and alerts to prevent unexpected costs.
            - generic [ref=e333]:
              - heading "What is the best tool for monitoring LLM API costs?" [level=3] [ref=e334]
              - paragraph [ref=e335]: Frugal provides a unified comparison table against native dashboards, letting you view real-time spend across OpenAI, Anthropic, Replicate, and fal.ai in one place.
            - generic [ref=e336]:
              - heading "How do I set a hard budget limit on the OpenAI API?" [level=3] [ref=e337]
              - paragraph [ref=e338]: 1. Connect your OpenAI API key to Frugal. 2. Navigate to Budget Rules. 3. Create a rule with your limit amount and choose the Block action. Frugal acts at the next 5-minute poll — pair it with OpenAI's native hard limit for a guaranteed stop.
          - generic [ref=e339]:
            - generic [ref=e340]:
              - heading "How to get alerts before OpenAI API overspend?" [level=3] [ref=e341]
              - paragraph [ref=e342]: 1. Go to the Alerts tab in Frugal. 2. Set up an alert for your OpenAI provider. 3. Configure thresholds (e.g. 80% of budget). 4. Choose email or Slack notifications.
            - generic [ref=e343]:
              - heading "How much does the Anthropic Claude 3 API cost compared to OpenAI?" [level=3] [ref=e344]
              - paragraph [ref=e345]: Frugal offers a real-time comparison table of your usage so you can directly compare your effective cost-per-token across Anthropic Claude 3 models and OpenAI GPT-4 models based on your actual prompts.
            - generic [ref=e346]:
              - heading "What happens when you exceed your AI API budget?" [level=3] [ref=e347]
              - paragraph [ref=e348]: Frugal alerts you by email or Slack and, with a Block rule, flags the connection at the next 5-minute poll. Because Frugal never sits between your app and the provider, pair Block with your provider's native hard limit for a guaranteed stop.
          - generic [ref=e349]:
            - generic [ref=e350]:
              - heading "How does the pricing work?" [level=3] [ref=e351]
              - paragraph [ref=e352]:
                - text: To see a full breakdown of limits and features, you can
                - link "compare Frugal pricing plans" [ref=e353] [cursor=pointer]:
