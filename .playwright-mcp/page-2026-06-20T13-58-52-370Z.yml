            - generic [ref=e625]:
              - heading "What payment methods do you accept?" [level=3] [ref=e626]
              - paragraph [ref=e627]: Payments are processed by Stripe — all major credit and debit cards are supported. You can upgrade, downgrade, or cancel from billing settings at any time.
